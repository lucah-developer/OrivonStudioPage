  <head>
    <meta charset="UTF-8" />

      property="og:description"

      name="twitter:description"
      content="Estudio de diseño y desarrollo web. Marcas, sitios, plataformas, e-commerce y automatización, con dirección creativa y criterio técnico."
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-512.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Anybody (ancho variable) para el titular "Del caos" de la sección Estudio -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,700..900&display=swap" />
    <link rel="preload" href="/fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/instrument-serif-italic-latin.woff2" as="font" type="font/woff2" crossorigin />

    <script>
      if ("scrollRestoration" in history) history.scrollRestoration = "manual";
      if (!location.hash) scrollTo(0, 0);

      var SITE = "https://www.orivonstudio.com.ar";
      var home = SITE + "/";
      var pageUrl = location.pathname === "/" ? home : SITE + location.pathname;
      var canonical = document.querySelector('link[rel="canonical"]');
      if (canonical) canonical.href = pageUrl;
      var ogUrl = document.querySelector('meta[property="og:url"]');
      if (ogUrl) ogUrl.content = pageUrl;
      if (location.pathname.indexOf("/dev") === 0) {
        var robots = document.querySelector('meta[name="robots"]');
        if (robots) robots.content = "noindex, nofollow";
      }

      var data = {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "ProfessionalService",
            "@id": home + "#organization",
            name: "Orivon Studio",
            url: home,
            image: SITE + "/icon-512.png",
            logo: SITE + "/favicon.svg",
            description:
              "Estudio de diseño y desarrollo web. Marcas, sitios, plataformas, e-commerce y automatización, con dirección creativa y criterio técnico.",
            email: "orivonstudio2022@gmail.com",
            telephone: "+54-9-260-430-9716",
            areaServed: "AR",
            address: { "@type": "PostalAddress", addressCountry: "AR" },
            sameAs: [
              "https://www.instagram.com/orivonstudio/",
              "https://www.tiktok.com/@orivonstudio"
            ],
            knowsAbout: ["Diseño web", "Desarrollo web", "Identidad de marca", "E-commerce", "Plataformas a medida", "Automatización"]
          },
          {
            "@type": "WebSite",
            "@id": home + "#website",
            url: home,
            name: "Orivon Studio",
            inLanguage: "es-AR",
            publisher: { "@id": home + "#organization" }
          }
        ]
      };
      var script = document.createElement("script");
      script.id = "orivon-ld";
      script.type = "application/ld+json";
      script.text = JSON.stringify(data);
      document.head.appendChild(script);
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </head>

  <body>
    <div id="root"></div>
  </body>
</html>
