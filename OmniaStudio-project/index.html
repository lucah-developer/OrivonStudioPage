<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orivon Studio — Diseño, desarrollo y dirección creativa</title>
    <meta
      name="description"
      content="Orivon Studio diseña y desarrolla marcas, sitios y productos digitales. Dirección creativa, diseño y desarrollo a medida."
    />
    <meta name="author" content="Orivon Studios" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#FAF2E8" />
    <meta name="color-scheme" content="light" />
    <link rel="canonical" href="" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:site_name" content="Orivon Studios" />
    <meta property="og:title" content="Orivon Studio — Diseño, desarrollo y dirección creativa" />
    <meta
      property="og:description"
      content="Orivon Studio diseña y desarrolla marcas, sitios y productos digitales. Dirección creativa, diseño y desarrollo a medida."
    />
    <meta property="og:url" content="" />
    <meta property="og:image" content="/icon-512.png" />
    <meta property="og:image:alt" content="Isotipo de Orivon Studios" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Orivon Studio — Diseño, desarrollo y dirección creativa" />
    <meta
      name="twitter:description"
      content="Orivon Studio diseña y desarrolla marcas, sitios y productos digitales. Dirección creativa, diseño y desarrollo a medida."
    />
    <meta name="twitter:image" content="/icon-512.png" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-512.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <link
      rel="preload"
      href="/fonts/SpaceGrotesk-VariableFont_wght.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />

    <script>
      if ("scrollRestoration" in history) history.scrollRestoration = "manual";
      if (!location.hash) scrollTo(0, 0);

      var pageUrl = location.origin + location.pathname;
      var canonical = document.querySelector('link[rel="canonical"]');
      if (canonical) canonical.href = pageUrl;
      var ogUrl = document.querySelector('meta[property="og:url"]');
      if (ogUrl) ogUrl.content = pageUrl;
      ["og:image", "twitter:image"].forEach(function (name) {
        var tag = document.querySelector('meta[property="' + name + '"], meta[name="' + name + '"]');
        if (tag && tag.content.startsWith("/")) tag.content = location.origin + tag.content;
      });

      var data = {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "ProfessionalService",
            "@id": pageUrl + "#organization",
            name: "Orivon Studios",
            url: pageUrl,
            image: location.origin + "/icon-512.png",
            logo: location.origin + "/favicon.svg",
            description:
              "Estudio de diseño y desarrollo. Construimos marcas, sitios y productos digitales con dirección creativa y criterio técnico.",
            email: "orivonstudio2022@gmail.com",
            telephone: "+54-9-260-430-9716",
            areaServed: "AR",
            address: { "@type": "PostalAddress", addressCountry: "AR" },
            sameAs: ["https://www.instagram.com/orivonstudio/"],
            knowsAbout: ["Diseño web", "Desarrollo web", "Experiencias 3D", "UX", "Motion design"]
          },
          {
            "@type": "WebSite",
            "@id": pageUrl + "#website",
            url: pageUrl,
            name: "Orivon Studios",
            inLanguage: "es-AR",
            publisher: { "@id": pageUrl + "#organization" }
          }
        ]
      };
      var script = document.createElement("script");
      script.type = "application/ld+json";
      script.text = JSON.stringify(data);
      document.head.appendChild(script);
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </head>

  <body>
    <div id="root"></div>
  </body>
</html>
